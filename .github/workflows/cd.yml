name: CD (merge to main -> QA -> PROD)
# main only receives merged pull requests from the development branch.
on:
  push:
    branches: [main]

jobs:
  qa:
    concurrency: { group: deploy-qa, cancel-in-progress: false }
    runs-on: ubuntu-latest
    environment: qa
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t qa
      - name: Run pipeline + checks in QA (rubicon_qa)
        run: databricks bundle run vendor_discovery_pipeline -t qa

  prod:
    needs: qa
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    runs-on: ubuntu-latest
    environment: prod        # add "Required reviewers" on this environment = manual approval gate
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
      - name: Run pipeline + checks in PROD (rubicon_prod)
        run: databricks bundle run vendor_discovery_pipeline -t prod
