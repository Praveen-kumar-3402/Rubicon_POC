name: CI (pull request checks)
# Runs on every pull request into development or main. It does NOT deploy; deployment happens when the PR is merged.
on:
  pull_request:
    branches: [development, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'qa' || 'dev' }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      TARGET: ${{ github.base_ref == 'main' && 'qa' || 'dev' }}
    steps:
      - name: Enforce branch flow (only development may be merged into main)
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "development" ]; then
            echo "::error::Pull requests into main must come from the development branch (got '$HEAD_REF')."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Syntax check notebooks
        run: python -m py_compile notebooks/*.py
      - uses: databricks/setup-cli@main
      - name: Validate bundle for the target environment
        run: databricks bundle validate -t "$TARGET"
